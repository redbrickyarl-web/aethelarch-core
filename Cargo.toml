[package]
name = "aethelarch-core"
version = "0.1.0"
edition = "2021"
description = "High-performance bit-sliced ternary SIMD engine for ARM64 NEON"
authors = ["Aethelarch"]
license = "MIT OR Apache-2.0"

[lib]
name = "aethelarch"
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
